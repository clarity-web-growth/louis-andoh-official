<script src="https://js.paystack.co/v1/inline.js"></script>

<script>
document.getElementById('pay-button').addEventListener('click', function () {

  const email = prompt("Enter your email for delivery:");

  if (!email) return;

  var handler = PaystackPop.setup({

    key: "pk_live_aaf933cf339451d84a1d96f85833a663a9720a99", 

    email: email,

    amount: 14700, // $147 = 14700 cents

    currency: "USD",

    ref: "GEF-" + Date.now(),

    metadata: {
      custom_fields: [
        {
          display_name: "Product",
          variable_name: "product",
          value: "Gold Execution Framework Authority Edition"
        }
      ]
    },

    callback: function(response){

      window.location.href =
        "/book-success.html?reference=" + response.reference;

    },

    onClose: function(){
      alert("Transaction cancelled.");
    }

  });

  handler.openIframe();

});
</script>
